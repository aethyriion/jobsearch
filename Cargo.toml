[package]
name = "job_search"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "Startup-focused job search pipeline and TUI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/aethyriion/jobsearch"
homepage = "https://github.com/aethyriion/jobsearch"
keywords = ["job-search", "tui", "cli", "ratatui", "sqlite"]
categories = ["command-line-utilities"]

[[bin]]
name = "jobsearch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
csv = "1"
dotenvy = "0.15"
futures = "0.3"
html-escape = "0.2"
open = "5"
ratatui = "0.29"
crossterm = "0.28"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "charset", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
textwrap = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
unicode-width = "0.2"

[profile.release]
opt-level = 2
strip = true
