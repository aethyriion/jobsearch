[package]
name = "jobsearch"
version = "0.3.1"
edition = "2021"
rust-version = "1.88"
description = "Terminal job-application tracker and ATS scraper: pulls roles from Greenhouse, Ashby, Lever and more, filters locally, scores fit with Claude"
license = "MIT"
# cargo-deb and some registries derive a maintainer from this; it is also
# what crates.io shows. Both MIT copyright holders are named in LICENSE.
authors = ["Stephen Rhodes <stephen@aethyriion.dev>"]
readme = "README.md"
repository = "https://github.com/aethyriion/jobsearch"
homepage = "https://github.com/aethyriion/jobsearch"
keywords = ["job-search", "job-tracker", "tui", "ratatui", "cli"]
categories = ["command-line-utilities"]
# The demo GIF and screenshot are 2 MB and useless to anyone installing
# the crate; .github likewise.
exclude = ["docs/**", ".github/**", "*.tape"]

[[bin]]
name = "jobsearch"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
csv = "1"
dotenvy = "0.15"
futures = "0.3"
html-escape = "0.2"
open = "5"
ratatui = "0.29"
crossterm = "0.28"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "gzip", "charset", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml itself is archived upstream. serde-yaml-bw is the fork still
# receiving releases; aliased to the old name so the call sites stay
# unchanged and the swap is reversible in one line.
serde_yaml = { package = "serde_yaml_bw", version = "2" }
textwrap = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
unicode-width = "0.2"
directories = "6"

[profile.release]
opt-level = 2
strip = true
