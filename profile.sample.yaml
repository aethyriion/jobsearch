# A fully worked (but entirely fictional) example profile — for reference,
# not for copying verbatim. profile.example.yaml is the blank template to
# actually start from; this file shows what a filled-in one looks like: the
# level of specificity/quantification each evidence bullet should have, and
# how to phrase a competency summary so the AI evaluation step has
# something concrete to reason about instead of vague
# claims like "worked on backend stuff."
#
# None of the people, companies, or numbers below are real.

identity:
  name: "Alex Morgan"
  headline: "Senior Software Engineer — Backend & Data Platforms"
  years_experience: 8
  location: "Portland, Oregon, USA"
  location_constraints: >
    Based in Portland, OR. Open to remote-US roles and to Portland/Seattle
    on-site or hybrid roles. Open to relocation for the right role within
    the Pacific Northwest, not further.
  education:
    - "B.Sc. Computer Science, University of Washington"

core_stack:
  languages_frameworks: ["Python", "Go", "TypeScript", "Django", "FastAPI", "gRPC"]
  ai_genai: ["OpenAI API", "Retrieval-augmented generation", "Prompt evaluation harnesses"]
  data_infra: ["PostgreSQL", "Kafka", "ClickHouse", "Terraform", "AWS", "Kubernetes"]

competencies:
  backend_architecture:
    summary: >
      Distributed backend systems for high-write-volume data platforms:
      service decomposition, data modeling, and the operational tooling
      to keep them debuggable under load.
    evidence:
      - "Split a monolithic Django app handling 40M events/day into 4
         gRPC services, cutting p99 write latency from 900ms to 140ms and
         letting each service scale independently during traffic spikes
         (Northwind Analytics)."
      - "Designed the schema and partitioning strategy for a
         ClickHouse-backed analytics store ingesting 2B rows/month,
         replacing nightly batch reports with sub-second ad-hoc queries
         (Northwind Analytics)."
      - "Introduced structured logging + distributed tracing (OpenTelemetry)
         across 12 services, cutting mean incident diagnosis time from 40
         minutes to under 10 (Cedar Robotics)."

  ai_genai_systems:
    summary: >
      Applied RAG and LLM-evaluation systems in production, with a focus on
      making model output measurably reliable rather than just plausible.
    evidence:
      - "Built a RAG pipeline over 200k internal support documents,
         reducing average support-ticket first-response time by 55% while
         keeping a human-reviewed hallucination rate under 2% (Cedar
         Robotics)."
      - "Designed an automated eval harness (golden-answer + LLM-judge
         scoring) that caught 3 regressions before release that manual QA
         had missed across two prior prompt-template changes (Cedar
         Robotics)."

  technical_leadership:
    summary: >
      Tech-lead-track IC: architecture reviews, mentoring, and de-risking
      ambiguous initiatives before they're fully scoped.
    evidence:
      - "Tech lead for a 5-engineer team rebuilding the billing pipeline;
         wrote the RFC, ran design review, and cut post-launch incident
         count by 70% versus the prior system's first quarter (Northwind
         Analytics)."
      - "Mentored 4 junior/mid-level engineers over 18 months; 3 were
         promoted a level during that period (Northwind Analytics, Cedar
         Robotics)."
      - "Volunteered to de-risk a stalled real-time-sync feature with no
         clear owner; shipped a working prototype in 2 weeks that became
         the basis for the production implementation (Cedar Robotics)."

  fullstack_product_delivery:
    summary: >
      Comfortable owning a feature end-to-end when the team is small enough
      that backend-only work isn't an option.
    evidence:
      - "Built the customer-facing usage-dashboard feature (React frontend
         + the backend aggregation service behind it) end-to-end, taken
         from a one-paragraph product brief to GA in 6 weeks (Cedar
         Robotics)."
      - "Partnered directly with two design contractors (no in-house
         designer at the time) to turn wireframes into a working settings
         UI, iterating over weekly review calls (Cedar Robotics, early
         stage)."

  cost_and_ops_impact:
    summary: >
      Treats infra spend as a design constraint, not an afterthought for
      finance to deal with later.
    evidence:
      - "Identified that a third-party geocoding API was 60% of monthly
         infra spend; built a caching layer with a 92% hit rate, cutting
         that line item by $18k/year (Northwind Analytics)."
      - "Right-sized over-provisioned Kubernetes node pools after profiling
         real utilization, reducing compute spend by 30% with no latency
         regression (Cedar Robotics)."

experience_timeline:
  - company: "Cedar Robotics"
    dates: "2022-2026"
    title: "Senior Software Engineer"
    domain: "B2B field-service software for robotics maintenance"
    stack: ["Python", "FastAPI", "React", "OpenAI API", "Kubernetes"]
  - company: "Northwind Analytics"
    dates: "2018-2022"
    title: "Software Engineer → Senior Software Engineer"
    domain: "Marketing analytics SaaS"
    stack: ["Python", "Django", "PostgreSQL", "Kafka", "ClickHouse"]

constraints:
  - "Prefers companies past initial product-market fit — burned once by an
     18-month pre-PMF stint that pivoted twice and then ran out of runway."
  - "Wants a senior IC or tech-lead-track role, not people management."
  - "Open to relocation within the Pacific Northwest only."
