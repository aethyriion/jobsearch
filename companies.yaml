# Company registry for the job discovery pipeline.
# ats: one of "greenhouse" | "ashby" | "workable" | "lever" | "smartrecruiters"
# slug: the identifier used in that ATS's public API URL
#
# Rebuilt 2026-09-25 for a remote-US platform/DevOps/infrastructure search.
# The list that shipped with the repo was the original author's Alberta/
# Canada target list; the Canada-only employers there have been dropped
# (they'd be rejected by filters.yaml's US location patterns anyway) and
# replaced with US/US-remote employers, weighted toward companies whose
# product IS infrastructure — those post the platform, SRE and
# infrastructure roles that match profile.yaml best. The original list is
# still in git history if you want any of it back.
#
# EVERY slug below was verified against its ATS's public API on 2026-09-25
# and returned at least one live posting. Slugs do rot (a board gets
# renamed, a company switches ATS), so if one goes quiet, check it with:
#     python -m app.main --company <slug>
#
# Note on Ohio-local employers: the big ones (Nationwide, Cardinal Health,
# Progressive, Hyland, CoverMyMeds) run Workday or iCIMS, which this
# pipeline has no fetcher for — they are not omitted by choice. The
# "Adzuna (Ohio, software engineer)" aggregator entry is what covers them.
#
# app/discover_companies.py appends newly-resolved companies to the bottom
# of this file automatically after an aggregator run.

companies:
