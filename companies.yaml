# Company registry for the job discovery pipeline.
# ats: one of "greenhouse" | "ashby" | "workable" | "lever" | "smartrecruiters"
# slug: the identifier used in that ATS's public API URL
#
# THIS IS A STARTING POINT, NOT A TARGET LIST. It ships weighted toward
# companies whose product IS infrastructure, because those post the
# platform, SRE and infrastructure roles this tool was built to find. If
# you are searching for something else, replace it — `jobsearch
# discover-yc` and the aggregator runs will rebuild it for you, and
# `jobsearch fetch --company <slug>` tests a single board.
#
# Every slug here returned at least one live posting when it was added.
# Slugs do rot — a board gets renamed, a company switches ATS — so if one
# goes quiet, check it on its own:
#     jobsearch fetch --company <slug>
#
# A note on coverage: many large non-tech employers run Workday or iCIMS,
# which this pipeline has no fetcher for. They are missing by limitation,
# not by choice. An Adzuna entry in aggregators.yaml scoped to your area is
# the practical way to reach them.
#
# `jobsearch discover-yc` and the aggregator runs append newly-resolved
# companies to the bottom of this file automatically, preserving these
# comments.

