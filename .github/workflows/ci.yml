name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the channel and the components, so there is
      # nothing to configure here — the action reads it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # No test touches the network, so CI needs no credentials and no
      # services. If a test ever does, it belongs behind a feature flag.
      - name: Test
        run: cargo test --all
      - name: Build release
        run: cargo build --release

      # The configs are part of the contract: a shipped filters.yaml that
      # doesn't compile, or a tech.yaml with a bad regex, is a broken clone
      # for everybody. `check` validates all of them without a database.
      - name: Validate shipped config
        run: |
          cp profile.example.yaml profile.yaml
          ./target/release/jobsearch check
