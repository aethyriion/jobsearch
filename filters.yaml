# Locations to keep, as regex patterns (case-insensitive) matched against
# the free-text location string each ATS/aggregator returns.
#
# Configured for a remote-US search out of Ohio. Three things this has to
# get right, all learned from live runs on 2026-09-25:
#
#  1. A bare "Remote" with no country qualifier is NOT allowed — plenty of
#     postings say "Remote Poland"/"Remote Spain"/"Remote Australia".
#  2. A bare '\bus\b' is NOT allowed either, because SmartRecruiters appends
#     the country code to every location ("Santa Clara, CA, us"), which
#     would quietly let in every US on-site role while Greenhouse's "Santa
#     Clara, CA" stayed rejected — the same job kept or dropped depending on
#     the ATS. So a US signal counts when it's at the START of the string
#     ("United States (Remote)", "USA, Canada, Mexico") or paired with a
#     remote word anywhere in it.
#  3. "Remote" is not the only remote word: Sysdig says "Flexible - USA",
#     others say "Distributed", "Home-based" or "Telecommute". Hence the
#     alternation below — keep the two paired patterns in sync if you edit it.
location_allow_patterns:
  # --- US / US-inclusive remote --------------------------------------
  - '^\s*(?:united states|usa|u\.s\.|us)\b'   # "United States (Remote)", "USA | Remote", "USA, Canada"
  # remote-word BEFORE the US signal: "Remote - US", "Flexible - USA", "Remote (US, Canada)"
  - '\b(?:remote|flexible|distributed|home[\s-]?based|telecommut\w*|virtual|work from home|wfh|hybrid)\b.*\b(?:united states|usa|us|u\.s\.)'
  # ...and AFTER it: "US Remote", "US-Remote", "Ohio, United States - Hybrid"
  - '\b(?:united states|usa|us)\b.*\b(?:remote|flexible|distributed|home[\s-]?based|telecommut\w*|virtual|work from home|wfh|hybrid)\b'
  - '\bu\.s\..*\b(?:remote|flexible|distributed|telecommut\w*|virtual|hybrid)\b'
  - '\bus(?:a)?[\s-]*only\b'                  # Remotive: "USA Only"
  - '\bnorth(?:ern)? america\b'               # Remotive returns both spellings
  - '\bamericas\b'
  - '\bworldwide\b'
  - '\banywhere\b'
  - '\bglobal(?:ly)?\b'
  # --- Ohio: on-site / hybrid within commuting range -----------------
  - '\bohio\b'
  - ',\s*oh\b'              # "Columbus, OH"
  - '\bcolumbus\b'
  - '\bcincinnati\b'
  - '\bcleveland\b'
  - '\bdayton\b'
  - '\bakron\b'
  - '\btoledo\b'
  # --- Relocation-eligible US on-site (uncomment to widen the search) -
  # Relocation within the US is open per profile.yaml, but switching these on
  # adds a LOT of volume — one live Arista Networks run went from 3 to 84
  # candidates, nearly all on-site roles in CA/NH — and every extra candidate
  # costs an AI-evaluation call. Uncomment when you want to see them.
  # - ',\s*us$'                                 # SmartRecruiters' "Nashua, NH, us"
  # - ',\s*(?:ca|ny|wa|tx|ma|co|il|ga|nc|pa|va|md|fl|az|ut|or|tn|mi|mn|wi|in|mo|nj|nh)\b'
  # - '\b(?:san francisco|new york|seattle|austin|boston|denver|chicago|atlanta|pittsburgh)\b'

# JD stack dealbreakers — if the description clearly requires one of these
# languages/frameworks and does NOT also mention anything from stack_core
# below, treat it as a mismatch. Only runs when a description is available.
# Word-boundary matched to avoid e.g. "java" matching "javascript".
#
# Because stack_core includes the platform tooling (Kubernetes, Terraform,
# AWS, Docker, CI), this list only really fires on pure application-dev
# roles in a stack that isn't a target — which is the intent. Java and C++
# are listed even though they're on the résumé: both are shipped but dated,
# and a Java-shop or C++-shop role isn't the target (see profile.yaml's
# constraints).
stack_dealbreakers:
  # NOTE on trailing \b after a punctuation character: '#' and '+' are not
  # word characters, so '\bc#\b' requires a word character immediately
  # after the '#' and therefore never matches "C# developer" or "We use
  # C#." — it matched nothing at all until 2026-09-25. Leading \b is fine
  # (space->c IS a boundary); just don't put one on the trailing side.
  - '\bc#'
  - '\.net\b'
  - '\basp\.net\b'
  - '\bvb\.net\b'
  - '\bruby\b'
  - '\brails\b'
  - '\bphp\b'
  - '\blaravel\b'
  - '\bdrupal\b'
  - '\bwordpress\b'
  - '\bmagento\b'
  - '\bsalesforce\b'
  - '\bapex\b'
  - '\bsharepoint\b'
  - '\babap\b'
  - '\bcobol\b'
  - '\bdelphi\b'
  - '\bscala\b'
  - '\bswift\b'
  - '\bkotlin\b'
  - '\bobjective-c\b'
  - '\bandroid\b'
  - '\bios development\b'
  - '\bjava\b'
  - '\bc\+\+'
  - '\bmatlab\b'
  - '\blabview\b'

# Your own core stack — if the JD mentions any of these, a stack dealbreaker
# match above is ignored (the role likely uses both, or the dealbreaker
# keyword is a false positive). Mirrors content/skills.toml's daily/shipped
# tiers, plus the platform tooling that defines the target roles.
stack_core:
  # languages
  - '\brust\b'
  - '\bgolang\b'
  - '\bgo\s+\(golang\)'
  - '\btypescript\b'
  - '\bjavascript\b'
  - '\bnode(?:\.?js)?\b'
