# Deterministic pre-filter rules, read by app/filters.py. Edit these lists
# directly as you refine what "in scope" means for you — no code changes
# needed. See app/filters.py's module docstring for how they're applied.
#
# Configured 2026-09-25 for Stephen Rhodes' search: senior/staff platform,
# DevOps/SRE, infrastructure and backend roles; remote US-first, Ohio
# on-site/hybrid, relocation within the US open. Stack from
# aethyriion.dev/content/skills.toml (Kubernetes/AWS/Terraform/Nix,
# Rust/Go/TypeScript/Python).

# Checked FIRST, before everything else, and word-boundary matched: a title
# matching one of these is dropped even if it also matches
# priority_title_keywords below. Needed because the priority list is
# substring-matched — "Junior DevOps Engineer" contains "devops engineer",
# and "Software Engineering Manager" contains "software engineer" — so
# level/track mismatches have to be vetoed before that rescue happens.
# (optional; an empty list means no hard exclusions.)
hard_exclusion_keywords:
  # LEVEL vetoes used to live here (intern, junior, entry level, new grad,
  # ...). They were moved out on 2026-09-25 and replaced by the `seniority:`
  # policy at the bottom of this file, because a keyword veto here is a
  # FETCH-time decision: it marks the job as failed and it never appears
  # again, so changing your mind means a re-fetch. The seniority policy is a
  # view filter instead — everything is stored, and widening or narrowing
  # the range takes effect instantly against jobs already in the database.
  #
  # What remains here is the wrong TRACK, not the wrong level — IC/IC-lead, not people management. Delete these to see
  # management roles too. "director"/"vp"/"head of" are deliberately broad:
  # a live Sysdig run surfaced "Director of Security Engineering", which the
  # narrower "director of engineering" missed.
  - "engineering manager"
  - "director"
  - "vp"
  - "vice president"
  - "head of"

# Unambiguous engineering-role title signals. If the title matches one of
