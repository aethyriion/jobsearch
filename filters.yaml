  - '\bk8s\b'
  - '\bk3s\b'
  - '\beks\b'
  - '\bhelm\b'
  - '\bkustomize\b'
  - '\bdocker\b'
  - '\bcontainer(?:s|ized|ization)?\b'
  # cloud / IaC
  - '\baws\b'
  - '\bamazon web services\b'
  - '\bterraform\b'
  - '\bcdktf\b'
  - '\bpulumi\b'
  - '\biac\b'
  - '\binfrastructure as code\b'
  # delivery / observability
  - '\bargocd\b'
  - '\bargo cd\b'
  - '\bgitops\b'
  - '\bcircleci\b'
  - '\bgithub actions\b'
  - '\bci/cd\b'
  - '\bprometheus\b'
  - '\bgrafana\b'
