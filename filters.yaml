# Below this many characters, a JD is treated as a short aggregator teaser
# snippet rather than a full posting (see app/filters.py's looks_truncated).
truncated_description_min_chars: 400

# ---------------------------------------------------------------------------
# Startup mode
# ---------------------------------------------------------------------------
# This is a VIEW policy, not a fetch policy. Everything is fetched, filtered
# and stored regardless of company stage — so changing anything here takes
# effect immediately against jobs already in the database, and never needs a
# re-fetch. Toggle it live in the TUI with `s`.
#
# Stage comes from three sources, most trustworthy first:
#   1. a `stage:` field on a companies.yaml entry (hand-curated)
#   2. the Y Combinator directory  (`jobsearch discover-yc`)
#   3. the AI evaluation step, inferring stage from the JD
# A weaker source never overwrites a stronger one.
startup:
  # Whether startup-only is the default view. `s` toggles it at runtime;
  # `jobsearch evaluate --all-stages` overrides it for one scoring run.
  enabled: true

  # The latest stage that still counts as a startup, inclusive. Earliest to
  # latest: pre-seed, seed, series-a, series-b, series-c, growth, public,
  # big-tech.
  max_stage: series-c

  # Headcount veto, applied independently of the stage label — a company
  # calling itself "Series C" with 4,000 people isn't what this mode is for,
  # and headcount is the harder number to spin. Companies with no known
  # headcount are judged on stage alone rather than dropped.
  max_headcount: 600

  # Whether a company whose stage nobody knows survives the filter.
  #
  # Start with `true`. Stage coverage is thin until you've run
  # `jobsearch discover-yc` and a scoring pass or two, and with `false` an
  # empty startup view looks like a broken filter rather than missing data.
  # Flip it to `false` once `jobsearch check` shows most companies carrying
  # a stage — that's when "startup" starts meaning "known to be a startup"
  # rather than "not known to be big".
  include_unknown: true

# ---------------------------------------------------------------------------
# Seniority
# ---------------------------------------------------------------------------
# Which rungs of the ladder are in scope. Like `startup:` above, this is a
# VIEW policy, not a fetch policy: every posting is stored whatever its
# level, so changing this range takes effect immediately against jobs
# already in the database — no re-fetch. Press `L` in the TUI to narrow to
# one rung without editing anything here.
#
# The level is read from the job title (see `infer_seniority`). It handles
# the usual markers — Junior/Jr, Entry Level, New Grad, I/II/III, Senior/Sr,
# Staff/Principal/Lead, and the management track — plus one real trap:
# "Member of Technical Staff" is a flat title several AI labs use at every
# level, so its "staff" is deliberately NOT read as staff-level.
seniority:
  # Lowest rung to include, inclusive. Widened from senior to junior on
  # 2026-09-25: senior-at-a-startup work often maps to a mid or junior
  # posting at a larger company, and the AI scoring step is a better judge
  # of whether a specific role is a step down than a title keyword is.
  min: junior

  # Highest rung to include, inclusive. `staff` keeps principal/lead IC
  # roles in and leaves `manager` out — management is also vetoed at fetch
  # time in hard_exclusion_keywords above.
  max: staff

  # Whether a posting whose title carries no level marker survives.
  #
  # Keep this true. A bare "Software Engineer" is one of the commonest
  # titles there is and genuinely states no level; excluding those would
  # throw away most of the list to avoid a handful of mismatches.
  include_unknown: true

# ---------------------------------------------------------------------------
# Hiring channel
# ---------------------------------------------------------------------------
# Patterns that mark a posting as coming from a STAFFING AGENCY rather than
# the employer directly. Matched against the company name and the
# description together, case-insensitively.
#
# This only ever produces "agency" — never "direct". "This reads like an
# agency listing" is something the text can support; "this is a direct
# hire" is merely the absence of that evidence, and recording it as a
# positive would turn a non-observation into a fact. Postings with no
# agency signal are left unlabelled, and you set them by hand (in the
# manual-entry form, or with `jobsearch channel --url ... --set direct`)
# where it matters.
#
# A manual value always wins over anything matched here.
# Matched against the POSTING TEXT. Phrases only — a company name here
# would hit customer lists ("brands including Randstad, Motorola, Netflix"
# in a Dialpad posting matched `randstad` and mislabelled it an agency).
#
# These have to be narrow. Two that were tried and removed, with the hit
# counts that condemned them:
#   'talent acquisition partner'  21 hits, ~all wrong — it's EEO
#                                 boilerplate ("speak to your talent
#                                 acquisition partner") in DIRECT postings.
#   bare 'our client(s)'          16 hits, mostly wrong — direct employers
#                                 say it about their own customers
#                                 ("our Client Success team").
agency_text_patterns:
  - '\bour client(?:s)?[,.]? (?:is|are|a |an )'
  - '\bour client is (?:seeking|looking|hiring)\b'
  - '\bon behalf of (?:our|a) client\b'
  - '\bwe are partnering with (?:a|our) client\b'
  - '\bpartnered with (?:a|our) client\b'
  - '\bstaffing (?:agency|firm|solutions provider)\b'
  - '\brecruit(?:ing|ment) (?:agency|firm)\b'
  - '\bexecutive search firm\b'
  - '\bcontract[- ]to[- ]hire\b'
  - '\bc2h\b'
  - '\bw2 contract\b'
  - '\bcorp[- ]to[- ]corp\b'
  - '\bc2c\b'
  - '\b1099 contract\b'

# Matched against the COMPANY NAME only. Add to this as you meet them.
agency_company_patterns:
  - '\bmotion recruitment\b'
  - '\bapex systems\b'
  - '\bvertalents\b'
  - '\bspar information\b'
  - '\brobert half\b'
  - '\bteksystems\b'
  - '\binsight global\b'
  - '\bcybercoders\b'
  - '\bjobot\b'
  - '\bkforce\b'
  - '\bmodis\b'
  - '\bexperis\b'
  - '\brandstad\b'
  - '\bmichael page\b'
  - '\bharnham\b'
  - '\bqdss\b'
  - '\blemon\.io\b'
  - '\bturing\.com\b'
  - '\btoptal\b'
  - '\bcrossover\b'
  - '\bedify technologies\b'
  - '\bcollabera\b'
  - '\bmindlance\b'
  - '\bdiverse lynx\b'
  - '\bsynechron\b'

# ---------------------------------------------------------------------------
# Staleness
# ---------------------------------------------------------------------------
# How many days a tracked application can sit in a status before the TUI
# flags it and `jobsearch stale` lists it. Purely a prompt to act — nothing
# is moved or changed automatically, because deciding a conversation is
# over is a judgement call and the tool shouldn't make it for you.
#
# Defaults reflect how these actually go: an interview loop that's gone
# quiet for three weeks is over; a recruiter screen resolves faster than
# that; and a cold application was never likely to get a reply at all, so
# it gets the longest leash before it's worth thinking about.
#
# Start the clock from the LAST transition, not from when you applied —
# a recruiter who emails on day 10 resets it, which is what the status
# history records.
staleness:
  interview: 21
  recruiter: 14
  applied: 28
  # Anything not listed is never flagged. `rejected`, `skipped` and
  # `silence` are terminal — there is nothing to chase.
