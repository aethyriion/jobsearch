# Broad-coverage job aggregators (as opposed to companies.yaml, which is
# one board per company). These search across many employers at once using
# keyword + location, so they catch companies you haven't identified yet —
# at the cost of more noise, which is exactly what filters.yaml exists for.
#
# type: one of "adzuna" | "remotive"
# params: passed straight through to that aggregator's search API, EXCEPT
#   two pipeline-level controls consumed by fetch_adzuna() before the
#   request is built, not sent to Adzuna itself:
#     max_pages — how many result pages to walk (default 5)
#     country   — Adzuna's country code, which is part of the URL path
#                 rather than a query param (default "us")
#
# Ships configured for a US-remote platform / DevOps / backend search, as a
# worked example. Keep `what`/`where` here in sync with filters.yaml's
# `location_allow_patterns` and `stack_core` — an aggregator query that
# reaches outside what filters.yaml accepts just spends requests on results
# that get dropped downstream.

aggregators:
  - name: Adzuna (US, platform engineer)
    type: adzuna
    params:
      what: "platform engineer"
      where: "United States"
      country: us
      results_per_page: 50
      max_pages: 5   # up to 250 results; stops early if a page comes back short
    notes: >
      Requires free app_id/app_key from https://developer.adzuna.com (instant
      signup, no approval wait per their docs — exact rate limit wasn't
      confirmed in research, check your account dashboard after signup).
      Set ADZUNA_APP_ID / ADZUNA_APP_KEY in .env.

  - name: Adzuna (US, devops engineer)
    type: adzuna
    params:
      what: "devops engineer"
      where: "United States"
      country: us
      results_per_page: 50
      max_pages: 5

  - name: Adzuna (US, site reliability engineer)
    type: adzuna
    params:
      what: "site reliability engineer"
      where: "United States"
      country: us
      results_per_page: 50
      max_pages: 3

  - name: Adzuna (US, infrastructure engineer kubernetes)
    type: adzuna
    params:
      what: "infrastructure engineer kubernetes"
      where: "United States"
      country: us
      results_per_page: 50
      max_pages: 3

  - name: Adzuna (US, backend engineer Rust or Go)
    type: adzuna
    params:
      # NOT `what: "backend engineer rust OR golang"`. Adzuna has no
      # boolean syntax inside `what` — it treats "OR" as a literal
      # keyword, so that spelling matched 0 jobs (verified 2026-09-25).
      # The real controls are separate params: `what_and` (every word must
      # appear) and `what_or` (at least one must). Both are passed through
      # to the API verbatim, like any param that isn't max_pages/country.
      what_and: "backend engineer"
      what_or: "rust golang"
      where: "United States"
      country: us
      results_per_page: 50
      max_pages: 3

  # The local half of a search: on-site/hybrid roles near you. The
  # remote-first entries above won't reliably surface these, because their
  # location strings are city names rather than "United States". Set `where`
  # to your state/province or metro and enable the matching patterns in
  # filters.yaml's `location_allow_patterns`, or this returns rows that are
  # then dropped for being out of area.
  # - name: Adzuna (local on-site/hybrid)
  #   type: adzuna
  #   params:
  #     what: "software engineer"
  #     where: "<your state, province or metro>"
  #     country: us
  #     results_per_page: 50
  #     max_pages: 3

  - name: Remotive (remote-only feed)
    type: remotive
    params:
      category: "software-development"
    notes: >
      No auth needed, remote-only listings. Two caveats confirmed against
      the live API on 2026-09-25: the public feed currently ignores
      `category` (it returns the same ~19-job set whatever you pass, so the
      param is kept only for documentation/future-proofing), and the
      category slug is "software-development" — not the "software-dev" this
      file shipped with. Remotive asks for max 4 requests/day and max
      2/minute, so keep this to ONE entry per pipeline run. Listings are
      delayed 24h from posting per their terms.

  # --------------------------------------------------------------------
  # Startup-native sources
  # --------------------------------------------------------------------
  - name: Hacker News (Who is hiring)
    type: hn
    params:
      months: 1   # how many monthly threads back to read; 1 is right for a recurring run
    notes: >
      The monthly "Ask HN: Who is hiring?" thread, via the public Algolia
      HN API (no key, no rate limit). Startup-dense by nature: almost every
      post is a small company hiring directly, very often a founder, which
      is close to the opposite of a general aggregator where startups are a
      thin slice under staffing-agency noise. Posts follow a
      "Company | Role | Location | REMOTE | ..." convention; posts that
      ignore it entirely are dropped rather than guessed at, and the full
      comment text always becomes the description so the AI step sees
      everything a human would. Dedup means re-reading the same thread on a
      later run costs nothing.

  # Wellfound (formerly AngelList Talent) is the other obvious
  # startup-native source and is deliberately absent rather than disabled-
  # with-a-TODO. Its GraphQL endpoint returns 403 behind a Cloudflare
  # interstitial for any client that doesn't present as a full browser —
  # and so does robots.txt. Reading it would mean impersonating a browser
  # specifically to defeat bot protection the site is clearly choosing to
  # apply, so this tool doesn't. The YC directory (`jobsearch discover-yc`)
  # plus the HN thread above cover the same ground through interfaces meant
  # to be read by programs. If you want Wellfound coverage, their email job
  # alerts into a mailbox you read yourself is the supported path.
